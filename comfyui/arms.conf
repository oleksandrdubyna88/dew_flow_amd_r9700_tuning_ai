# The ComfyUI arm table (`bin/r9700 comfy bench`, E2.S2): one arm per line, the four fields of config/arms.conf separated by " | ":
#   name | ComfyUI arguments | environment (KEY=VALUE words) | mounts (empty in every row: a bench container mounts only what the worker gives it)
# A "#" starts a comment line; an empty field stays empty; arm names are lower-case letters and digits. The arms and their words are the parent plan's table
# (PLAN_comfyui_r9700.md, *The tuning series*); the rows differ from `base` in exactly one change. Two words are the ones this file adds to that table:
#   MIOPEN_LOG_LEVEL=5   without a log level MIOpen prints no find line, and the evidence row of `miopen` (comfyui/arm_evidence.conf) needs those lines;
#   PYTORCH_TUNABLEOP_FILENAME=/cache/tunableop/tunableop_results.csv and the two bounds: TunableOp writes its results file when the process ends and the bound
#   (10 ms and 10 iterations per shape, torch's defaults being 30 ms and 100) keeps the tuning inside one arm-round; the cold-run ceiling is the real limit.
# COMFY_BENCH_WEIGHT_DTYPE and COMFY_BENCH_COMPILE are read by comfyui/bench.py (the loader's weight dtype, a compile node); the other words are ComfyUI's, torch's or MIOpen's.
# `--listen`, `--port`, `--base-directory`, `--models-directory` and `--output-directory` belong to the worker; a memory-mode word never appears (ComfyUI's default for
# every arm); PYTORCH_HIP_ALLOC_CONF=expandable_segments:True never appears either (it breaks the first allocation under /dev/dxg: trap 1 of the plan).
base      | | |
fp16acc   | --fast fp16_accumulation | |
fp8wmm    | --fast fp8_matrix_mult | COMFY_BENCH_WEIGHT_DTYPE=fp8_e4m3fn |
tunableop | | PYTORCH_TUNABLEOP_ENABLED=1 PYTORCH_TUNABLEOP_FILENAME=/cache/tunableop/tunableop_results.csv PYTORCH_TUNABLEOP_MAX_TUNING_DURATION_MS=10 PYTORCH_TUNABLEOP_MAX_TUNING_ITERATIONS=10 |
miopen    | | COMFYUI_ENABLE_MIOPEN=1 MIOPEN_FIND_MODE=FAST MIOPEN_LOG_LEVEL=5 |
compile   | | COMFY_BENCH_COMPILE=1 TORCHINDUCTOR_CACHE_DIR=/cache/inductor TORCH_LOGS=recompiles |
