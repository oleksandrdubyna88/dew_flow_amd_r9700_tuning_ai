# The model sets of `bin/r9700 comfy fetch <set>...` (lib/comfy.sh reads this file; comfyui/fetch_model.sh downloads each line).
# One file per line: <set> <folder> <url> <sha256>
#   set     the name given to `comfy fetch` (lower-case letters and digits); one set may have several lines
#   folder  the folder of the models volume ComfyUI reads the file from (checkpoints, vae, text_encoders, diffusion_models, ...)
#   url     the https address of the file
#   sha256  the PINNED hash of the file: read once from the source's X-Linked-ETag on 2026-11-07 and checked by every download.
# A file is kept only when its own sha256 equals the pin. `fetch` also refuses, before any download, a source that now publishes ANOTHER sha256
# than the pin (the file changed under the same name). A pin is changed only by a reviewed commit, never by the fetch.
# The names the sets were first asked under (stable-diffusion-v1-5-archive, z_image_turbo, Wan_2.2_ComfyUI_Repackaged, Wan_2.1_ComfyUI_repackaged) answer 307 to the
# renamed repositories below; the current names are pinned here so that a fetch does not depend on a redirect the source may drop.
