# The model sets of `bin/r9700 comfy fetch <set>...` (lib/comfy.sh reads this file; comfyui/fetch_model.sh downloads each line).
# One file per line: <set> <folder> <url> <sha256>
#   set     the name given to `comfy fetch` (lower-case letters and digits); one set may have several lines
#   folder  the folder of the models volume ComfyUI reads the file from (checkpoints, vae, text_encoders, diffusion_models, ...)
#   url     the https address of the file
#   sha256  the PINNED hash of the file: read once from the source's X-Linked-ETag on 2026-11-07 and checked by every download.
# A file is kept only when its own sha256 equals the pin. `fetch` also refuses, before any download, a source that now publishes ANOTHER sha256
# than the pin (the file changed under the same name). A pin is changed only by a reviewed commit, never by the fetch.
# The names the sets were first asked under (stable-diffusion-v1-5-archive, z_image_turbo, Wan_2.2_ComfyUI_Repackaged, Wan_2.1_ComfyUI_repackaged) answer 307 to the
# renamed repositories below; the current names are pinned here so that a fetch does not depend on a redirect the source may drop.
# Sizes (x-linked-size, bytes): sd15 2 132 696 762 (about 2.1 GB); zimage 335 304 388 + 8 044 982 048 + 12 309 866 400 (about 20.7 GB);
# wan5b 1 409 400 960 + 9 999 658 848 + 6 735 906 897 + the FastWan LoRA 660 874 456 (about 18.8 GB).
# The FastWan LoRA line (E2.S2): the full-attention step-distillation LoRA of Wan 2.2 TI2V 5B, rank 128, bf16; its pin is the X-Linked-ETag of the source, read once on
# 2026-11-08 (repository revision 8260d429d19fd7a72304cad059160b95d843913f) and equal to the LFS hash the repository's file list gives.
# The `audio` and `film` sets (2026-11-10, the sound and the frame interpolation of a short film made on the card; ComfyUI v0.44 runs all of them with its own nodes):
# ACE-Step 1.5 turbo (music and singing, one checkpoint), Stable Audio 3 medium with its two text encoders (effects and music beds), and FILM (16 -> 32 fps,
# comfyui/tools/film_interpolate.py). Their pins are the X-Linked-ETag of each source, read once on 2026-11-10. The FILM file was downloaded and accepted against its
# pin that day; the four audio files were not yet complete when these lines were written, so their first `comfy fetch audio` is the first check of their pins.
# Sizes: audio about 25 GB (10.0 + 1.19 + 4.55 + 9.22 GB), film 68.9 MB.
