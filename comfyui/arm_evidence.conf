# The evidence of the ComfyUI arms (`bin/r9700 comfy bench`, E2.S2): one row per arm of comfyui/arms.conf, three fields separated by " | ":
#   arm | activation | inertness
# A field is `-` (nothing) or checks joined by " ; ", ALL required. A check is `<kind>=<argument>`; the argument runs to the separator or the end of the field.
#   log=<regex>       a line of the whole server log matches (grep -E)        nolog=<regex>   no line of the whole server log matches
#   coldlog=<regex>   a line of the COLD run's cut of the log matches         node=<class>    every measured run's node list holds a node of that class: executed, or reused from ComfyUI's execution cache
#   cache=<folder>    the cold run left at least one file under /cache/<folder>   tunable=<file>   the copied results files <name>*.csv (TunableOp writes the device number before the extension) have a Validator line and a result row
#   argv=<word>       ComfyUI's argv (from /system_stats) holds the word: the flag was PASSED, never proof that it acted, so a row whose activation is argv checks alone is refused
# ACTIVATION missing: the arm-round is rejected, naming the check. INERTNESS present: the record says `inert on <workflow>` with the matched lines, and the arm is
# never reported as "no gain". A recompile line is never a check (it is the flag of the measured run). The strings are ComfyUI v0.44.0's (comfy/model_management.py,
# comfy/model_base.py, comfy/sd.py, comfy/ldm/modules/attention.py, read 2026-11-08); `base`'s inertness is `-`: the reference is never inert.
# arm       | activation                                                                       | inertness
base        | log=Using pytorch attention                                                      | -
fp16acc     | log=Enabled fp16 accumulation                                                    | log=model weight dtype torch\.bfloat16 ; log=VAE load device.*dtype: torch\.bfloat16
fp8wmm      | log=model weight dtype torch\.float8_e4m3fn ; argv=fp8_matrix_mult                | -
tunableop   | tunable=tunableop_results.csv                                                    | -
miopen      | nolog=cudnn\.enabled = False ; coldlog=MIOpen\(HIP\): Info.*[Ff]ind                 | -
compile     | node=TorchCompileModel ; cache=inductor                                          | -
